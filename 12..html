<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Example</title>
</head>
<body>

  <div class="block">Welcome to my website</div>

  <h3>DOM - Document Object Model</h3>
  <h3 id="username">Hey My name is:</h3>

  <button id="clickButton">Click me</button>
  <br><br>
  <input id="input-username" type="text" placeholder="Enter your name">

  <script>
    const button = document.getElementById("clickButton")
    const uname = document.getElementById("input-username")
    const username = document.getElementById("username")

    button.addEventListener("click", () => {
      const value = uname.value
      localStorage.setItem("name", value)
      username.innerText = "Hey My name is: " + value
    })

    window.addEventListener("load", () => {
      const value = localStorage.getItem("name")
      if (value) {
        username.innerText = "Hey My name is: " + value
      }
    })
  </script>

</body>
</html>
