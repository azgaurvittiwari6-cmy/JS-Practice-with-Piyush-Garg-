<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .red-color{
            color: red;
        }
        .underline{
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <nav class="block">
        <p>Welcome to my website</p>
    </nav>
    <div class="block">
        <h4>Hey There, My name is <span  class = "red-color" id    = "username" >Anuj Tiwari</span></h4>
        <p class="paragraph">Here is a code for you</p>
        <pre><code>console.log("Hey there");  </code></pre>
    </div>
    <script>
        const ele  = document.getElementById("username")
        ele.innerText = "Piyush Garg"   
      
        ele.style.textDecoration = "underline"
        ele.style.color = "tomato"   
        ele.parentElement.style.backgroundColor = "grey"    
        ele.remove()
        console.log(ele);
        
       
    
    </script>
    
</body>
</html>
