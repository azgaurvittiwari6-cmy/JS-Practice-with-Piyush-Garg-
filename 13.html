<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multi Button Counter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    button {
      padding: 10px 15px;
      margin: 8px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>Multi Button Click Counter</h2>

  <button class="btn">Button 1: 0</button>
  <button class="btn">Button 2: 0</button>
  <button class="btn">Button 3: 0</button>
  <button class="btn">Button 4: 0</button>
  <button class="btn">Button 5: 0</button>

  <script>
    const buttons = document.querySelectorAll(".btn");

    function handleClick(button) {
      let count = 0;

      button.addEventListener("click", function () {
        count++;
        button.innerText = "Clicked: " + count;
      });
    }

    for (let i = 0; i < buttons.length; i++) {
      handleClick(buttons[i]);
    }
  </script>

</body>
</html>
